<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurum PromptLab</title>
<style>
:root{--bg:#08151e;--panel:#102632;--line:#244653;--text:#e9f7fa;--muted:#a0b8c0;--cyan:#52d6e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#164354,transparent 40%),var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}.top{padding:42px 0 24px}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.14em;font-size:.75rem;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;margin:10px 0}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:50px}.panel{background:#0d202b;border:1px solid var(--line);border-radius:16px;padding:22px}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#071923;color:var(--text);font:inherit}textarea{min-height:92px;resize:vertical}.output{white-space:pre-wrap;min-height:340px;background:#06131b;border:1px solid var(--line);padding:15px;border-radius:10px;color:#d5edf0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;background:var(--cyan);color:#06242b;padding:11px 15px;font-weight:800;cursor:pointer}button.secondary{background:#193b49;color:var(--text)}.hint{font-size:.83rem;color:var(--muted)}@media(max-width:720px){.layout{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">Laboratório de engenharia de prompt</div><h1>Aurum <span style="color:var(--cyan)">PromptLab</span></h1><p class="muted">Estruture instruções claras, reutilizáveis e fáceis de avaliar. A ferramenta monta o texto localmente; não chama uma API de IA.</p></header>
<div class="layout"><section class="panel"><h2>Construtor</h2><label for="role">Papel da IA</label><input id="role" placeholder="Ex.: professor particular de programação"><label for="goal">Objetivo</label><textarea id="goal" placeholder="O que a IA precisa fazer?"></textarea><label for="context">Contexto</label><textarea id="context" placeholder="Informações que a IA precisa considerar..."></textarea><label for="rules">Regras e restrições</label><textarea id="rules" placeholder="Ex.: explique passo a passo, não invente dados..."></textarea><label for="format">Formato da resposta</label><select id="format"><option>Passo a passo</option><option>Lista organizada</option><option>Tabela</option><option>Relatório com seções</option><option>Código comentado</option></select><div class="actions"><button onclick="buildPrompt()">Gerar prompt</button><button class="secondary" onclick="clearForm()">Limpar</button></div></section>
<section class="panel"><h2>Resultado</h2><div id="output" class="output" aria-live="polite">Preencha os campos e clique em “Gerar prompt”.</div><div class="actions"><button onclick="copyPrompt()">Copiar prompt</button></div><p id="feedback" class="hint" aria-live="polite"></p></section></div></main>
<script>
function buildPrompt(){
 const role=document.getElementById("role").value.trim(),goal=document.getElementById("goal").value.trim(),context=document.getElementById("context").value.trim(),rules=document.getElementById("rules").value.trim(),format=document.getElementById("format").value;
 if(!goal){document.getElementById("feedback").textContent="Preencha pelo menos o objetivo.";return;}
 const parts=["Atue como "+(role||"um assistente especialista no tema")+".","\\nOBJETIVO\\n"+goal,context?"\\nCONTEXTO\\n"+context:"",rules?"\\nREGRAS E RESTRIÇÕES\\n"+rules:"","\\nFORMATO DA RESPOSTA\\n"+format,"\\nAntes de responder, verifique se entendeu o objetivo. Se faltar uma informação essencial, faça uma pergunta objetiva. Não invente fatos; sinalize incertezas."];
 document.getElementById("output").textContent=parts.filter(Boolean).join("\\n");document.getElementById("feedback").textContent="Prompt estruturado. Revise antes de utilizar.";
}
async function copyPrompt(){const value=document.getElementById("output").textContent;if(value.startsWith("Preencha")){document.getElementById("feedback").textContent="Gere um prompt primeiro.";return;}try{await navigator.clipboard.writeText(value);document.getElementById("feedback").textContent="Prompt copiado.";}catch{document.getElementById("feedback").textContent="Não foi possível copiar automaticamente neste navegador.";}}
function clearForm(){["role","goal","context","rules"].forEach(id=>document.getElementById(id).value="");document.getElementById("format").selectedIndex=0;document.getElementById("output").textContent="Preencha os campos e clique em “Gerar prompt”.";document.getElementById("feedback").textContent="";}
</script></body></html>
